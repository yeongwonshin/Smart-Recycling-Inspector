syntax = "proto3";

package recycling;

service RecyclingInspector {
  rpc AnalyzeImages(AnalyzeRequest) returns (AnalyzeResponse);
  rpc Benchmark(BenchmarkRequest) returns (BenchmarkResponse);
}

message ImagePayload {
  string image_id = 1;
  string filename = 2;
  bytes data = 3;
}

message AnalyzeRequest {
  string request_id = 1;
  int32 thread_count = 2;
  int32 batch_size = 3;
  repeated ImagePayload images = 4;
}

message FeatureValue {
  string name = 1;
  double value = 2;
}

message ProcessingBreakdown {
  double decode_ms = 1;
  double preprocess_ms = 2;
  double feature_ms = 3;
  double inference_ms = 4;
  double postprocess_ms = 5;
  double total_ms = 6;
}

message ImageAnalysisResult {
  string image_id = 1;
  string filename = 2;
  string category = 3;
  double confidence = 4;
  string contamination_status = 5;
  double contamination_score = 6;
  string recommendation = 7;
  string explanation = 8;
  repeated string disposal_steps = 9;
  repeated FeatureValue features = 10;
  ProcessingBreakdown breakdown = 11;
  bool ok = 12;
  string error_message = 13;
}

message AnalyzeResponse {
  string request_id = 1;
  int32 image_count = 2;
  int32 thread_count = 3;
  int32 batch_size = 4;
  double server_wall_time_ms = 5;
  double throughput_images_per_sec = 6;
  string summary = 7;
  repeated ImageAnalysisResult results = 8;
}

message BenchmarkRequest {
  repeated int32 thread_counts = 1;
  repeated int32 batch_sizes = 2;
  int32 synthetic_image_count = 3;
  int32 width = 4;
  int32 height = 5;
}

message BenchmarkPoint {
  int32 thread_count = 1;
  int32 batch_size = 2;
  int32 image_count = 3;
  double avg_latency_ms = 4;
  double throughput_images_per_sec = 5;
  double speedup = 6;
  double server_wall_time_ms = 7;
}

message BenchmarkResponse {
  repeated BenchmarkPoint points = 1;
}
